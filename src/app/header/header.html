<div class="header-container">

  <div class="header-left">
    <button class="btn-header" routerLink="/catalog" routerLinkActive="active" click="goToCatalog()" [disabled]="isAlreadyInCatalog()">Catálogo</button>
  </div>

  <a class="logo-link" routerLink="/home" routerLinkActive="active" (click)="goToHome()">
    <img src="/assets/images/poke-lens-logo.png" alt="Inicio" class="logo" />
  </a>

  <div class="header-right">
    @if (user(); as currentUser) {
    <button class="btn-header avatar-btn" (click)="goToProfile()" aria-label="Perfil">
      <img [src]="currentUser.avatar_url || '/assets/images/default.png'" alt="Perfil" class="avatar"
        (error)="setDefaultAvatar($event)" />
    </button>

    <button class="btn-header" routerLink="/vault" routerLinkActive="active" (click)="goToTeams()" [disabled]="isAlreadyInTeams()">Equipos</button>

    <button class="btn-header" (click)="logOut()">Salir</button>
    } @else {
    <button class="btn-header" routerLink="/logIn" routerLinkActive="active" (click)="goToLogIn()">Iniciar sesión</button>
    <button class="btn-header" routerLink="/signIn" routerLinkActive="active" (click)="goToSignIn()">Registrarse</button>
    }
  </div>
</div>
