<div class="header-container">

  <div class="header-left">
    <button class="btn-header" routerLink="/catalog" routerLinkActive="active" click="goToCatalog()" [disabled]="isAlreadyInCatalog()">Catálogo</button>
    <button class="btn-header" routerLink="/leaderboard" routerLinkActive="active" (click)="goToLeaderboard()" [disabled]="isAlreadyInLeaderboard()">Leaderboard</button>
  </div>

  <a class="logo-link" routerLink="/home" routerLinkActive="active" (click)="goToHome()">
    <img src="/assets/images/poke-lens-logo.png" alt="Inicio" class="logo" />
  </a>

  <div class="header-right">
    @if (user(); as currentUser) {
    <button class="btn-header avatar-btn" (click)="goToProfile()" aria-label="Perfil" [disabled]="isAlreadyInProfile()">
      <img [src]="currentUser.avatar_url || '/assets/images/default.png'" alt="Perfil" class="avatar"
        (error)="setDefaultAvatar($event)" />
    </button>

    <button class="btn-header" routerLink="/vault" routerLinkActive="active" (click)="goToTeams()" [disabled]="isAlreadyInTeams()">Equipos</button>

    <app-notification-menu></app-notification-menu>

    } @else {
    <button class="btn-header" routerLink="/logIn" routerLinkActive="active" (click)="goToLogIn()">Iniciar sesión</button>
    <button class="btn-header" routerLink="/signIn" routerLinkActive="active" (click)="goToSignIn()">Registrarse</button>
    }
  </div>

  <!-- Hamburger Button (Mobile) -->
  <button class="hamburger-btn" (click)="toggleSidebar()" aria-label="Menú">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Mobile Sidebar -->
  @if (sidebarOpen()) {
    <div class="sidebar-overlay" (click)="closeSidebar()"></div>
    <div class="sidebar">
      <button class="btn-header" routerLink="/catalog" routerLinkActive="active" (click)="goToCatalog(); closeSidebar()" [disabled]="isAlreadyInCatalog()">Catálogo</button>
      <button class="btn-header" routerLink="/leaderboard" routerLinkActive="active" (click)="goToLeaderboard(); closeSidebar()" [disabled]="isAlreadyInLeaderboard()">Leaderboard</button>

      @if (user(); as currentUser) {
        <button class="btn-header avatar-btn" (click)="goToProfile(); closeSidebar()" aria-label="Perfil" [disabled]="isAlreadyInProfile()">
          <img [src]="currentUser.avatar_url || '/assets/images/default.png'" alt="Perfil" class="avatar" (error)="setDefaultAvatar($event)" />
        </button>
        <button class="btn-header" routerLink="/vault" routerLinkActive="active" (click)="goToTeams(); closeSidebar()" [disabled]="isAlreadyInTeams()">Equipos</button>
      } @else {
        <button class="btn-header" routerLink="/logIn" routerLinkActive="active" (click)="goToLogIn(); closeSidebar()">Iniciar sesión</button>
        <button class="btn-header" routerLink="/signIn" routerLinkActive="active" (click)="goToSignIn(); closeSidebar()">Registrarse</button>
      }
    </div>
  }
</div>
