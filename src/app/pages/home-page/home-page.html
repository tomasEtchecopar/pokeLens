<div class="home-container">
    <!-- <img src="assets/images/poke-lens-logo.png" alt="PokeLens" class="logo" /> -->
    <p class="subtitle">Bienvenido a PokeLens, tu wiki Pokémon con juegos y desafios.</p>

    <div class="featured-section">
        <h2>POKEMON DEL DIA</h2>
        @if(loadingDaily()){
        <p>Cargando pokemon del dia...</p>
        }
        @else if(pokemonOfTheDay(); as p){
        <div class="pokemon-featured">
            <app-pokemon-card [pokemon]="p"></app-pokemon-card>
        </div>
        }
    </div>

    <div class="navigation-section">
        <div class="nav-buttons">
            <button class="catalog-button" routerLink="/catalog" routerLinkActive="active">
                <span class="button-text">Catálogo</span>
            </button>

            <button class="quiz-button" routerLink="/quiz" routerLinkActive="active">
                <span class="button-text">Quiz</span>
            </button>
            <button class="quiz-button" routerLink="/pokeguess" routerLinkActive="active">
                <span class="button-text">Poke-Guess</span>
            </button>
            <button class="quiz-button" routerLink="/memory" routerLinkActive="active">
                <span class="button-text">Memotest</span>
            </button>

        </div>
    </div>
</div>
