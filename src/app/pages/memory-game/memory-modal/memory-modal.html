@if (isOpen()) {
<div class="overlay" (click)="onClose()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="header">
      <div class="title">🎉 ¡GANASTE!</div>
      <button class="x" type="button" (click)="onClose()">✕</button>
    </div>

    <div class="content">
      <p class="line">Completaste el tablero.</p>

      <div class="stats">
        <div class="stat">
          <span class="label">Puntos ganados</span>
          <span class="value">
            @if (pointsAwarded() !== null) {
            +{{ pointsAwarded() }}
            } @else {
            ...
            }
          </span>
        </div>

        <!-- intentos restantes -->
        <div class="stat">
          <span class="label">Intentos restantes hoy</span>
          <span class="value">
            @if (attemptsLeftToday() !== null) {
            {{ attemptsLeftToday() }}
            } @else {
            ...
            }
          </span>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" type="button" (click)="onRestart()">
          Jugar otra vez
        </button>
        <button class="btn" type="button" (click)="onClose()">
          Cerrar
        </button>
      </div>
    </div>
  </div>
</div>
}
