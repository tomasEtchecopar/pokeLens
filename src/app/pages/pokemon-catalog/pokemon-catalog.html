<div class="catalog">

  <div class="center">
    <h1>Catalogo Pokemon</h1>
    <app-search-bar placeholder="Buscar pokemon..." [currentTerm]="catalogState.search()" (searchUpdate)="onSearch($event)">
    </app-search-bar>


  </div>

  <div class="search-section">
    <div class="filters">
         <app-pokemon-filter-menu [currentFilters]="catalogState.filters()" (filterUpdate)="applyFilters($event)">
    </app-pokemon-filter-menu>1
    </div>


    <div class="sorting">
    <pokemon-sort-menu [currentSort]="catalogState.sort()" (sorted)="onSort($event)"></pokemon-sort-menu>
    </div>
  </div>

  <div class="grid">
    @for (pokemon of pokemons(); track pokemon.id){
    <app-pokemon-card [pokemon]="pokemon"></app-pokemon-card>
    }
  </div>
    @if (isLoading()) {
      <div class="loading loading-more">
        <div class="spinner"></div>
        <span>Cargando mas Pokémon...</span>
      </div>
    }@if(pokemons().length === 0 && hasActiveFiltersOrSearch()){
      <div class="no-results">
        <p>No se encontraron Pokémon con los filtros actuales</p>
      </div>
    }

  <div #scrollSentinel class="scroll-sentinel"></div>

</div>
